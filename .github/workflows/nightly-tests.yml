name: Nightly Mobile Tests

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  android-tests:
    runs-on: ubuntu-latest

    env:
      AppSettings__Platform: ${{ secrets.TEST_PLATFORM }}
      REPORTPORTAL_UUID: ${{ secrets.REPORTPORTAL_UUID }}
      REPORTPORTAL_PROJECT: ${{ secrets.REPORTPORTAL_PROJECT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Setup Node.js (for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2

      - name: Start Appium server
        run: appium --log-timestamp &

      - name: Restore .NET dependencies
        run: dotnet restore App.Automation/App.Automation.csproj

      - name: Generate ReportPortal config from secrets
        run: |
          mkdir -p App.Automation/bin/Debug/net7.0
          cat > App.Automation/bin/Debug/net7.0/ReportPortal.config.json << CONFIG
          {
            "server": {
              "url": "https://demo.reportportal.io/api/v1",
              "project": "${REPORTPORTAL_PROJECT}",
              "authentication": {
                "uuid": "${REPORTPORTAL_UUID}"
              }
            },
            "launch": {
              "name": "Mobile App Automation (Nightly CI)",
              "description": "Nightly scheduled run via GitHub Actions",
              "debugMode": false,
              "attributes": [
                { "key": "platform", "value": "${APPSETTINGS_Platform}" },
                { "value": "mobile" },
                { "value": "ci" }
              ]
            }
          }
          CONFIG

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: dotnet test App.Automation/App.Automation.csproj --settings App.Automation/Tests/Base/ci.runsettings
